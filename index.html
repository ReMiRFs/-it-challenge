<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Challenge</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; worker-src blob:; frame-src 'self' about:; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'"><style>
*{box-sizing:border-box}body{margin:0;background:#151922;color:#e8edf4;font:16px system-ui,sans-serif}header{height:64px;background:#202530;border-bottom:1px solid #343b48;display:flex;align-items:center;gap:20px;padding:0 4vw}header strong{letter-spacing:2px}header span{margin-left:auto;color:#aeb9c8}button{font:inherit;cursor:pointer;border:1px solid #46505e;border-radius:6px;background:#282e39;color:#e8edf4;padding:10px 15px}button:hover{border-color:#a0cdb0}button.primary{background:#a0cdb0;color:#14251b;border:0;font-weight:700}main{max-width:1450px;margin:auto;padding:24px 4vw}h1{font-size:28px;margin:12px 0}p{line-height:1.5;color:#c1cad7}small,.muted{color:#a5afbf}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid #39414e;border-radius:8px;overflow:hidden;background:#10131a}.bar{background:#262c37;padding:10px 14px;font-size:14px;color:#b8c4d4}textarea{display:block;width:100%;height:340px;resize:vertical;background:#10131a;color:#c9d9ee;border:0;padding:16px;font:16px/1.65 Consolas,monospace;tab-size:2;outline-color:#a0cdb0}canvas{display:block;width:100%;height:340px;object-fit:contain;background:#253b50}iframe{width:100%;height:340px;border:0;background:white}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions .next{margin-left:auto}#feedback{white-space:pre-wrap;padding:12px 0;line-height:1.5}#hint{color:#e9bd73;padding:10px 0}.group{margin:22px 0}.group h2{font-size:19px}.tasks{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.task{text-align:left;min-height:100px;display:flex;flex-direction:column;gap:8px}.task small{font-size:12px}.done{color:#a0cdb0}.intro{border-left:3px solid #a0cdb0;padding-left:16px}.output{padding:18px;min-height:340px;white-space:pre-wrap;font:15px/1.6 Consolas,monospace;color:#c9d9ee;overflow:auto;max-height:340px} @media(max-width:800px){.grid{grid-template-columns:1fr}.tasks{grid-template-columns:repeat(2,1fr)}header{gap:8px}textarea{height:240px}}
</style><header><strong>IT / CHALLENGE</strong><button id="home">Все задания</button><span id="progress"></span><button id="reset">Сбросить прогресс</button></header><main id="main"></main><script>
const tasks=[{"cat": 0, "title": "Первый запуск", "desc": "Робот стоит в начале дорожки. Доведи его до флага на клетке 4. Команда move(n) перемещает робота на n клеток вправо.", "starter": "move(1);", "hint": "Что означает число внутри скобок?", "tests": [["robot", 4]], "kind": "robot"}, {"cat": 0, "title": "Обратный путь", "desc": "Робот должен оказаться на клетке 2, посетив сначала клетку 6. Отрицательное число означает движение влево.", "starter": "move(6);\nmove(1);", "hint": "Как обозначить противоположное направление?", "tests": [["route", [6, 2]]], "kind": "robot"}, {"cat": 0, "title": "Повторение", "desc": "Дойди до клетки 8 четырьмя одинаковыми шагами. Используй цикл for.", "starter": "for (let i = 0; i < 2; i++) {\n  move(2);\n}", "hint": "Сколько раз выполняется тело цикла?", "tests": [["route", [2, 4, 6, 8]]], "kind": "robot"}, {"cat": 0, "title": "Развилка", "desc": "Функция route(energy) должна возвращать 8 при энергии не меньше 5, иначе 2.", "starter": "function route(energy) {\n  return 2;\n}", "hint": "Где проходит граница между двумя случаями?", "tests": [["fn", "route", [4], 2], ["fn", "route", [5], 8], ["fn", "route", [10], 8]], "kind": "robot"}, {"cat": 0, "title": "Маршрут по массиву", "desc": "Выполни все шаги из массива steps по порядку. Используй цикл, не перечисляй команды вручную.", "starter": "const steps = [2, 3, -1, 4];\n// Твой цикл", "hint": "Как получить каждый элемент массива?", "tests": [["route", [2, 5, 4, 8]]], "kind": "robot"}, {"cat": 1, "title": "Прыжок", "desc": "Подбери силу прыжка, чтобы персонаж достиг платформы. Высота прыжка должна быть не меньше 64 пикселей.", "starter": "let jumpPower = 6;\njump(jumpPower);", "hint": "Какой параметр влияет на высоту?", "tests": [["jump", 64]], "kind": "game"}, {"cat": 1, "title": "Монеты", "desc": "Каждая монета даёт 10 очков. Функция score(coins) должна возвращать итог.", "starter": "function score(coins) {\n  return coins;\n}", "hint": "Как связаны число монет и очки?", "tests": [["fn", "score", [3], 30], ["fn", "score", [0], 0], ["fn", "score", [7], 70]], "kind": "game"}, {"cat": 1, "title": "Магазин", "desc": "Функция buy(balance, price) возвращает остаток после покупки. Если денег недостаточно, баланс не меняется.", "starter": "function buy(balance, price) {\n  return balance - price;\n}", "hint": "Когда вычитание не должно происходить?", "tests": [["fn", "buy", [20, 5], 15], ["fn", "buy", [3, 5], 3], ["fn", "buy", [5, 5], 0]], "kind": "game"}, {"cat": 1, "title": "Комбо", "desc": "Функция combo(hits) возвращает 10 очков за первое попадание, 20 за второе, 30 за третье и так далее. Верни сумму.", "starter": "function combo(hits) {\n  let total = 0;\n  return total;\n}", "hint": "Какая величина меняется на каждом шаге?", "tests": [["fn", "combo", [3], 60], ["fn", "combo", [0], 0], ["fn", "combo", [5], 150]], "kind": "game"}, {"cat": 1, "title": "Таблица рекордов", "desc": "Функция best(scores) возвращает три лучших результата в порядке убывания (или все, если их меньше трёх).", "starter": "function best(scores) {\n  return scores;\n}", "hint": "Как сравнить два числа при сортировке?", "tests": [["fn", "best", [[5, 30, 12, 90]], [90, 30, 12]], ["fn", "best", [[2, 10]], [10, 2]], ["fn", "best", [[]], []]], "kind": "game"}, {"cat": 2, "title": "Заголовок сайта", "desc": "Измени HTML: заголовок h1 должен содержать текст Моя игра.", "starter": "<h1>Привет!</h1>\n<p>Мой первый сайт</p>", "hint": "Какой тег обозначает главный заголовок?", "tests": [["text", "h1", "Моя игра"]], "kind": "web"}, {"cat": 2, "title": "Цвет", "desc": "Сделай фон элемента main синим (blue), а текст белым (white).", "starter": "<style>main { background: gray; color: black; }</style>\n<main>Мой сайт</main>", "hint": "Чем отличается цвет текста от цвета фона?", "tests": [["css", "main", "backgroundColor", "rgb(0, 0, 255)"], ["css", "main", "color", "rgb(255, 255, 255)"]], "kind": "web"}, {"cat": 2, "title": "Карточка проекта", "desc": "Добавь в article заголовок h2 и кнопку button с текстом Играть.", "starter": "<article>\n  <p>Новая игра</p>\n</article>", "hint": "Какие элементы должны находиться внутри article?", "tests": [["exists", "article h2"], ["text", "article button", "Играть"]], "kind": "web"}, {"cat": 2, "title": "Галерея", "desc": "Расположи три карточки в ряд с помощью display: flex и расстоянием 12px.", "starter": "<style>.gallery { display: block; }</style>\n<div class=\"gallery\"><div>Игра 1</div><div>Игра 2</div><div>Игра 3</div></div>", "hint": "Какой элемент управляет расположением дочерних карточек?", "tests": [["css", ".gallery", "display", "flex"], ["css", ".gallery", "gap", "12px"], ["count", ".gallery > div", 3]], "kind": "web"}, {"cat": 2, "title": "Адаптивная сетка", "desc": "Создай сетку из двух равных колонок, а при ширине до 400px — одну колонку. Используй grid и @media.", "starter": "<style>.gallery { display:grid; grid-template-columns:1fr; }</style>\n<div class=\"gallery\"><div>A</div><div>B</div></div>", "hint": "Как браузер узнаёт, что экран стал узким?", "tests": [["grid", ".gallery", 2, 1]], "kind": "web"}, {"cat": 3, "title": "Опечатка", "desc": "Исправь код, чтобы функция double(n) удваивала число.", "starter": "function double(n) {\n  return N * 2;\n}", "hint": "Одинаковы ли имена с большой и маленькой буквы?", "tests": [["fn", "double", [4], 8], ["fn", "double", [-3], -6]], "kind": "console"}, {"cat": 3, "title": "Сломанный счётчик", "desc": "Функция count(n) должна возвращать n, увеличивая счётчик в цикле n раз.", "starter": "function count(n) {\n  let total = 0;\n  for (let i=0; i<=n; i++) total++;\n  return total;\n}", "hint": "Сколько итераций происходит при n = 0?", "tests": [["fn", "count", [0], 0], ["fn", "count", [4], 4], ["fn", "count", [9], 9]], "kind": "console"}, {"cat": 3, "title": "Пароль", "desc": "Функция allowed(code) должна возвращать true только для строки \"OPEN\".", "starter": "function allowed(code) {\n  if (code = \"OPEN\") return true;\n  return false;\n}", "hint": "Чем присваивание отличается от сравнения?", "tests": [["fn", "allowed", ["OPEN"], true], ["fn", "allowed", ["NO"], false], ["fn", "allowed", [""], false]], "kind": "console"}, {"cat": 3, "title": "Среднее", "desc": "Исправь функцию среднего арифметического непустого массива.", "starter": "function average(a) {\n  let sum = 0;\n  for (const n of a) sum = n;\n  return sum / a.length;\n}", "hint": "Сохраняется ли сумма предыдущих элементов?", "tests": [["fn", "average", [[2, 4, 6]], 4], ["fn", "average", [[10]], 10], ["fn", "average", [[1, 2]], 1.5]], "kind": "console"}, {"cat": 3, "title": "Дубликаты", "desc": "Функция unique(a) должна сохранять только первые появления элементов в исходном порядке.", "starter": "function unique(a) {\n  let result = [];\n  for (const x of a) {\n    if (result.includes(x)) result.push(x);\n  }\n  return result;\n}", "hint": "В каком случае элемент нужно добавить?", "tests": [["fn", "unique", [[2, 1, 2, 3, 1]], [2, 1, 3]], ["fn", "unique", [[]], []], ["fn", "unique", [[4, 4]], [4]]], "kind": "console"}, {"cat": 4, "title": "Палиндром", "desc": "Функция palindrome(s) проверяет, одинаково ли слово читается в обе стороны. Регистр не учитывается.", "starter": "function palindrome(s) {\n  return false;\n}", "hint": "Как сравнить исходную строку с обратной?", "tests": [["fn", "palindrome", ["Казак"], true], ["fn", "palindrome", ["code"], false], ["fn", "palindrome", [""], true]], "kind": "console"}, {"cat": 4, "title": "Частоты", "desc": "Функция frequent(a) возвращает наиболее частое число в непустом массиве. При равенстве — меньшее число.", "starter": "function frequent(a) {\n  return a[0];\n}", "hint": "Как хранить число появлений каждого значения?", "tests": [["fn", "frequent", [[3, 2, 3, 2]], 2], ["fn", "frequent", [[1, 7, 7, 3]], 7], ["fn", "frequent", [[9]], 9]], "kind": "console"}, {"cat": 4, "title": "Скобки", "desc": "Функция balanced(s) проверяет правильность вложения круглых и квадратных скобок. Строка содержит только скобки.", "starter": "function balanced(s) {\n  return true;\n}", "hint": "Какая открывающая скобка должна закрываться первой?", "tests": [["fn", "balanced", ["([])"], true], ["fn", "balanced", ["([)]"], false], ["fn", "balanced", ["(()"], false], ["fn", "balanced", [""], true], ["fn", "balanced", ["]"], false]], "kind": "console"}, {"cat": 4, "title": "Минимум монет", "desc": "Функция minCoins(n) возвращает минимальное число монет номиналом 1, 3 и 4 для суммы n (целое 0–100).", "starter": "function minCoins(n) {\n  return n;\n}", "hint": "Можно ли использовать уже найденные ответы для меньших сумм?", "tests": [["fn", "minCoins", [6], 2], ["fn", "minCoins", [0], 0], ["fn", "minCoins", [10], 3], ["fn", "minCoins", [99], 25]], "kind": "console"}, {"cat": 4, "title": "Кратчайший путь", "desc": "Функция distance(grid) возвращает минимальное число шагов из верхнего левого угла в нижний правый. 0 — свободно, 1 — стена. Ходить можно по четырём направлениям. Если пути нет, верни -1.", "starter": "function distance(grid) {\n  return -1;\n}", "hint": "Как исследовать сначала все клетки на расстоянии одного шага, затем двух?", "tests": [["fn", "distance", [[[0, 0], [1, 0]]], 2], ["fn", "distance", [[[0, 1], [1, 0]]], -1], ["fn", "distance", [[[0]]], 0], ["fn", "distance", [[[0, 0, 0], [1, 1, 0], [0, 0, 0]]], 4]], "kind": "console"}];const cats=['Алгоритмы','Разработка игр','Создание сайтов','Поиск ошибок','Экспертные задачи'];let state={done:[],drafts:{}};try{const raw=JSON.parse(localStorage.getItem('itchallenge-v1'));if(raw&&typeof raw==='object'){state.done=Array.isArray(raw.done)?[...new Set(raw.done.filter(i=>Number.isInteger(i)&&i>=0&&i<25))]:[];for(let i=0;i<25;i++){if(typeof raw.drafts?.[i]==='string')state.drafts[i]=raw.drafts[i].slice(0,12000)}}}catch{}let current=0,worker=null,runId=0;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('itchallenge-v1',JSON.stringify(state))}catch{}$('progress').textContent=`Выполнено: ${state.done.length} / 25`;}function stop(){runId++;if($('run'))$('run').disabled=false;if(worker){worker.terminate();worker=null}}function menu(){stop();$('main').innerHTML='<h1>Выбери своё испытание</h1><p>Начни с первого задания вместе с преподавателем. Затем выбирай любое направление.</p>'+cats.map((c,k)=>`<section class="group"><h2>0${k+1} / ${c}</h2><div class="tasks">${tasks.map((t,i)=>t.cat===k?`<button class="task" data-i="${i}"><small>${String(i+1).padStart(2,'0')} · ${k===4?'Эксперт': ['Старт','Старт','Средний','Сложный','Сложный'][i%5]}</small><b>${t.title}</b><small class="done">${state.done.includes(i)?'✓ Выполнено':''}</small></button>`:'').join('')}</div></section>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openTask(+b.dataset.i));save()}
function openTask(i){stop();current=i;let t=tasks[i];$('main').innerHTML=`<small>${cats[t.cat]} / ${i+1} из 25</small><h1>${t.title}</h1><p>${t.desc}</p><div class="grid"><section class="panel"><div class="bar">${t.kind==='web'?'index.html':'main.js'} · редактор кода</div><textarea id="code" maxlength="12000" spellcheck="false" aria-label="Редактор кода"></textarea></section><section class="panel"><div class="bar">Результат выполнения</div><div id="view"></div></section></div><div class="actions"><button class="primary" id="run">▶ Запустить код</button><button id="hintBtn">Подсказка</button><button id="restore">Вернуть исходный код</button><button class="next" id="next">${i===0?'Выбрать направление':'Следующее задание'} →</button></div><div id="hint" hidden></div><div id="feedback" role="status" aria-live="polite">Измени код и запусти программу.</div>`;let ed=$('code');ed.value=state.drafts[i]??t.starter;ed.oninput=()=>{stop();state.drafts[i]=ed.value;save();$('feedback').style.color='';$('feedback').textContent='Код изменён. Запусти его для проверки.'};ed.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();ed.setRangeText('  ',ed.selectionStart,ed.selectionEnd,'end');ed.oninput()}if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();run()}};$('run').onclick=run;$('hintBtn').onclick=()=>{$('hint').hidden=false;$('hint').textContent=t.hint};$('restore').onclick=()=>{stop();ed.value=t.starter;ed.oninput();preview(t);$('feedback').textContent='Исходный код восстановлен.'};$('next').onclick=()=>i===0||i===24?menu():openTask(i+1);preview(t);save()}
function preview(t){$('view').innerHTML=t.kind==='web'?'<iframe id="web" sandbox="allow-same-origin" title="Предпросмотр сайта"></iframe>':t.kind==='robot'||t.kind==='game'?'<canvas id="scene" width="640" height="340"></canvas>':'<div class="output" id="out">Здесь появятся результаты тестов.</div>';if(t.kind==='web'){$('web').srcdoc=webDoc(t.starter)}else if($('scene'))draw(t,0,0,[])}
function draw(t,pos,height,lines){let c=$('scene');if(!c)return;let x=c.getContext('2d');x.fillStyle='#253b50';x.fillRect(0,0,640,340);x.fillStyle='#304c60';for(let i=0;i<12;i++)x.fillRect(i*60,220-(i*47%110),42,120+(i*47%110));x.fillStyle='#e8dbac';x.beginPath();x.arc(540,60,26,0,7);x.fill();if(t.kind==='robot'){for(let i=0;i<10;i++){x.fillStyle=i===pos?'#a0cdb0':'#44566a';x.fillRect(20+i*60,230,54,50);x.fillStyle='#fff';x.font='14px monospace';x.fillText(i,42+i*60,267)}let target=t.tests[0][0]==='robot'?t.tests[0][1]:t.tests[0][0]==='route'?t.tests[0][1].at(-1):null;if(target!==null){x.fillStyle='#f5c85d';x.fillRect(42+target*60,195,4,35);x.fillRect(46+target*60,195,19,13)}x.fillStyle='#e7a76e';x.fillRect(28+pos*60,198,35,30);x.fillStyle='#182630';x.fillRect(34+pos*60,204,23,10)}else{x.fillStyle='#91b27b';x.fillRect(0,270,640,70);x.fillRect(380,206,180,12);x.fillStyle='#f5c85d';x.beginPath();x.arc(470,187,10,0,7);x.fill();x.fillStyle='#e7a76e';x.fillRect(height>=64?440:100,240-Math.min(height,150),30,30)}x.fillStyle='#fff';x.font='15px monospace';lines.slice(0,4).forEach((l,i)=>x.fillText(l.slice(0,75),15,22+i*20))}
function webDoc(code){const doc=new DOMParser().parseFromString(code,'text/html');doc.querySelectorAll('script,iframe,frame,object,embed,link,meta,base,form,svg,math,video,audio').forEach(e=>e.remove());for(const e of doc.querySelectorAll('*'))for(const a of [...e.attributes])if(/^on/i.test(a.name)||['href','src','srcset','action','formaction','ping','background'].includes(a.name.toLowerCase()))e.removeAttribute(a.name);code=doc.head.innerHTML+doc.body.innerHTML;return '<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:"><style>body{font:18px system-ui;padding:24px;margin:0}article,.gallery>div{padding:12px;border:1px solid #ddd;border-radius:6px}button{padding:8px}</style>'+code}
function explainError(message){const m=String(message);const rules=[[/is not defined/i,'Имя не определено. Проверь написание переменных и функций.'],[/Unexpected end|missing.*after/i,'Код не завершён. Проверь скобки и кавычки.'],[/Unexpected token|Unexpected identifier|Invalid or unexpected token/i,'Синтаксическая ошибка. Проверь символы, скобки и написание команд.'],[/already been declared/i,'Имя объявлено повторно.'],[/not a function/i,'Попытка вызвать значение, которое не является функцией.'],[/Cannot read properties|Cannot set properties/i,'Попытка обратиться к отсутствующему значению.'],[/Assignment to constant/i,'Нельзя изменить константу.'],[/Maximum call stack/i,'Слишком много вложенных вызовов функций.'],[/Invalid array length/i,'Недопустимый размер массива.'],[/BigInt|circular structure/i,'Результат имеет неподдерживаемый формат.']];const match=rules.find(([r])=>r.test(m));return match?[match[1],'JavaScript: '+m]:[m]}
function finish(ok,lines){$('run').disabled=false;$('feedback').textContent=(ok?'✓ Задание выполнено!':'Пока не получилось. Проверь результат и попробуй ещё раз.')+'\n'+lines.join('\n');$('feedback').style.color=ok?'#a0cdb0':'#e9bd73';if(ok&&!state.done.includes(current)){state.done.push(current);save()}}
async function runWeb(t,code,id){let f=$('web');let load=()=>new Promise((r,j)=>{let timer=setTimeout(()=>j(Error('Предпросмотр не загрузился')),2000);f.onload=()=>{clearTimeout(timer);r()};f.srcdoc=webDoc(code)});await load();if(id!==runId)return;let d=f.contentDocument,w=f.contentWindow;let results=[];for(let test of t.tests){let [type,sel,a,b]=test,e=d.querySelector(sel),ok=false;if(type==='text')ok=e?.textContent.trim()===a;if(type==='exists')ok=!!e;if(type==='count')ok=d.querySelectorAll(sel).length===a;if(type==='css')ok=!!e&&w.getComputedStyle(e)[a]===b;if(type==='grid'&&e){f.style.width='600px';await new Promise(r=>setTimeout(r,80));if(id!==runId)return;let n=w.getComputedStyle(e).gridTemplateColumns.split(' ').length;f.style.width='350px';await new Promise(r=>setTimeout(r,80));if(id!==runId)return;ok=n===a&&w.getComputedStyle(e).gridTemplateColumns.split(' ').length===b;f.style.width='100%'}let detail='';if(!e)detail='Не найден элемент '+sel;else if(type==='text')detail='Текущий текст: '+e.textContent.trim().slice(0,100);else if(type==='css')detail='Текущее свойство '+a+': '+w.getComputedStyle(e)[a];else if(type==='count')detail='Найдено элементов: '+d.querySelectorAll(sel).length;else if(type==='grid')detail='Проверь расположение колонок при разных размерах окна.';results.push({ok,detail})}finish(results.every(v=>v.ok),results.map((v,i)=>`Проверка ${i+1}: ${v.ok?'пройдена':'не пройдена. '+v.detail}`))}
const workerSource=`const send=self.postMessage.bind(self);for(const key of ['fetch','XMLHttpRequest','WebSocket','EventSource','importScripts','Worker','SharedWorker','BroadcastChannel','indexedDB','caches']){try{Object.defineProperty(self,key,{value:undefined,writable:false,configurable:false})}catch{}}self.onmessage=e=>{let {code,tests}=e.data,pos=0,route=[],height=0,logs=[];try{const move=n=>{if(!Number.isInteger(n))throw Error('Команда move ожидает целое число.');if(pos+n<0||pos+n>9)throw Error('Робот вышел за пределы дорожки');pos+=n;if(route.length>=200)throw Error('Слишком много команд движения');route.push(pos)};const jump=n=>{if(typeof n!=='number'||!Number.isFinite(n)||n<0)throw Error('Некорректная сила прыжка');if(n>1000)throw Error('Слишком большое значение');height=n*n/1.5};const checks=tests.filter(t=>t[0]==='fn');const calls=checks.map(t=>t[1]+'(...'+JSON.stringify(t[2])+')').join(',');let values=new Function('move','jump','console',code+'\\n;return ['+calls+'];')(move,jump,{log:(...a)=>{if(logs.length<10)logs.push(a.map(v=>String(v).slice(0,300)).join(' ').slice(0,500))}});let j=0;let results=tests.map(t=>{let v=t[0]==='fn'?values[j++]:t[0]==='robot'?pos:t[0]==='route'?route:height;let expected=t[0]==='fn'?t[3]:t[1];return {ok:t[0]==='jump'?v>=expected:JSON.stringify(v)===JSON.stringify(expected),line:'Проверка '+(t[0]==='fn'?t[1]+'('+t[2].map(x=>JSON.stringify(x)).join(', ')+')':t[0]==='jump'?'высоты': 'маршрута')+': '+(v===undefined?'undefined (нет возвращаемого значения)':typeof v==='number'&&!Number.isFinite(v)?String(v):JSON.stringify(v))}});send({results,pos,height,route,logs})}catch(err){send({error:String(err.message).slice(0,500)})}}`;
function run(){stop();let id=runId,t=tasks[current],code=$('code').value;$('feedback').style.color='';$('feedback').textContent='Выполняется…';if(!code.trim()){finish(false,['Редактор пуст. Напиши код или восстанови исходный.']);return}if(code.length>12000){finish(false,['Код слишком длинный.']);return}$('run').disabled=true;if(t.kind==='web'){if(!/<[a-z][^>]*>/i.test(code)){finish(false,['Не найдено HTML-элементов. Проверь разметку.']);return}runWeb(t,code,id).catch(e=>{if(id===runId)finish(false,[String(e.message)])});return}let url=URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'}));try{worker=new Worker(url)}catch(e){finish(false,['Не удалось запустить редактор: '+e.message]);return}finally{URL.revokeObjectURL(url)}let active=worker;let timer=setTimeout(()=>{if(id===runId){stop();finish(false,['Программа выполняется слишком долго. Проверь циклы.'])}},1500);active.onmessage=e=>{clearTimeout(timer);if(id!==runId)return;active.terminate();worker=null;let d=e.data;if(!d||typeof d!=='object'||(!d.error&&(!Array.isArray(d.results)||d.results.length!==t.tests.length||!d.results.every(r=>r&&typeof r.ok==='boolean'&&typeof r.line==='string')||!Array.isArray(d.logs)||d.logs.length>10||!d.logs.every(v=>typeof v==='string'&&v.length<=500)||!Array.isArray(d.route)||d.route.length>200||!d.route.every(v=>Number.isInteger(v)&&v>=0&&v<=9)||!Number.isFinite(d.pos)||!Number.isFinite(d.height)))){finish(false,['Некорректный результат выполнения.']);return}if(d.error){finish(false,explainError(d.error));return}let lines=d.results.map(r=>(r.ok?'✓ ':'× ')+r.line.slice(0,500)+(r.ok?'':' — результат не соответствует условию'));if($('out'))$('out').textContent=[...d.logs,...lines].join('\n');if($('scene')){draw(t,d.pos,d.height,lines);if(t.kind==='robot'&&d.route.length){let steps=[0,...d.route];steps.forEach((p,k)=>setTimeout(()=>{if(id===runId)draw(t,p,d.height,k===steps.length-1?lines:[])},k*180))}}finish(d.results.every(r=>r.ok),lines)};active.onerror=e=>{clearTimeout(timer);if(id===runId){stop();finish(false,explainError(e.message||'Ошибка запуска'))}};active.postMessage({code,tests:t.tests})}
$('home').onclick=menu;$('reset').onclick=()=>{if(confirm('Удалить прогресс и код предыдущей группы?')){stop();state={done:[],drafts:{}};try{localStorage.removeItem('itchallenge-v1')}catch{}save();openTask(0)}};openTask(0);
</script></html>
